<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxímetro Digital - Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 16px;
      color: #222;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
    }
    h1, h2 {
      margin-top: 0;
    }
    label, input, button {
      font-size: 18px;
    }
    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 8px 0 16px;
    }
    button {
      padding: 10px 18px;
      cursor: pointer;
    }
    .barra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }
    .error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <main>
    <h1>Taxímetro Digital</h1>

    <section id="acceso">
      <form id="formulario-acceso">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="mensaje-acceso" class="error" role="alert"></p>
    </section>

    <section id="panel" hidden>
      <div class="barra">
        <h2>Historial de carreras</h2>
        <div>
          <button id="boton-actualizar" type="button">Actualizar</button>
          <button id="boton-salir" type="button">Cerrar sesión</button>
        </div>
      </div>
      <p id="resumen"></p>
      <table>
        <thead>
          <tr>
            <th>Inicio</th>
            <th>Duración (min:s)</th>
            <th>Importe</th>
          </tr>
        </thead>
        <tbody id="carreras"></tbody>
      </table>
      <p id="mensaje-panel" class="error" role="alert"></p>
    </section>
  </main>

  <script>
    const CLAVE_TOKEN = "taximetro_token";

    const seccionAcceso = document.getElementById("acceso");
    const seccionPanel = document.getElementById("panel");
    const formulario = document.getElementById("formulario-acceso");
    const campoContrasena = document.getElementById("contrasena");
    const mensajeAcceso = document.getElementById("mensaje-acceso");
    const mensajePanel = document.getElementById("mensaje-panel");
    const resumen = document.getElementById("resumen");
    const cuerpoTabla = document.getElementById("carreras");

    function mostrar(sesionIniciada) {
      seccionAcceso.hidden = sesionIniciada;
      seccionPanel.hidden = !sesionIniciada;
    }

    function cabeceraSesion() {
      return { Authorization: "Bearer " + sessionStorage.getItem(CLAVE_TOKEN) };
    }

    function formatearDuracion(segundos) {
      const minutos = Math.floor(segundos / 60);
      const resto = String(segundos % 60).padStart(2, "0");
      return minutos + ":" + resto;
    }

    function crearFila(carrera) {
      const fila = document.createElement("tr");
      const valores = [
        carrera.inicio,
        formatearDuracion(carrera.duracion),
        carrera.importe.toFixed(2) + " €",
      ];
      for (const valor of valores) {
        const celda = document.createElement("td");
        celda.textContent = valor;
        fila.appendChild(celda);
      }
      return fila;
    }

    function pintarHistorial(carreras) {
      const total = carreras.reduce((suma, carrera) => suma + carrera.importe, 0);
      resumen.textContent = carreras.length === 0
        ? "Todavía no hay carreras."
        : carreras.length + " carreras · Total " + total.toFixed(2) + " €";
      cuerpoTabla.replaceChildren(...carreras.map(crearFila));
    }

    function cerrarSesionLocal(mensaje) {
      sessionStorage.removeItem(CLAVE_TOKEN);
      mensajeAcceso.textContent = mensaje;
      mostrar(false);
    }

    async function cargarHistorial() {
      mensajePanel.textContent = "";
      try {
        const respuesta = await fetch("/historial", { headers: cabeceraSesion() });
        if (respuesta.status === 401 || respuesta.status === 403) {
          cerrarSesionLocal("La sesión ha caducado. Entra de nuevo.");
          return;
        }
        if (!respuesta.ok) {
          mensajePanel.textContent = "No se pudo leer el historial.";
          return;
        }
        pintarHistorial(await respuesta.json());
      } catch (error) {
        mensajePanel.textContent = "No se pudo conectar con el servidor.";
      }
    }

    async function iniciarSesion(evento) {
      evento.preventDefault();
      mensajeAcceso.textContent = "";
      try {
        const respuesta = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contrasena: campoContrasena.value }),
        });
        campoContrasena.value = "";
        const datos = await respuesta.json();
        if (!respuesta.ok) {
          mensajeAcceso.textContent = datos.detail;
          return;
        }
        sessionStorage.setItem(CLAVE_TOKEN, datos.token);
        mostrar(true);
        cargarHistorial();
      } catch (error) {
        mensajeAcceso.textContent = "No se pudo conectar con el servidor.";
      }
    }

    async function cerrarSesion() {
      const cabecera = cabeceraSesion();
      cerrarSesionLocal("");
      try {
        await fetch("/logout", { method: "POST", headers: cabecera });
      } catch (error) {
        mensajeAcceso.textContent = "";
      }
    }

    formulario.addEventListener("submit", iniciarSesion);
    document.getElementById("boton-actualizar").addEventListener("click", cargarHistorial);
    document.getElementById("boton-salir").addEventListener("click", cerrarSesion);

    if (sessionStorage.getItem(CLAVE_TOKEN)) {
      mostrar(true);
      cargarHistorial();
    } else {
      mostrar(false);
    }
  </script>
</body>
</html>
